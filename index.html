<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuniCitas</title>
<link rel="icon" href="logo.svg?v=3">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#7b5cff;--t:#1fd1c1;--g:linear-gradient(90deg,#7b5cff,#1fd1c1);--soft:#f1edff}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:#f7f7fb;color:#1d1b2e;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:18px 18px 40px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand img{height:38px}
.langs{display:flex;gap:4px}.langs button,.fmt button{border:none;border-radius:10px;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:600;background:#ebe9f3;color:#6b6980;cursor:pointer}.langs button.on,.fmt button.on{background:var(--g);color:#fff}
.hero{border-radius:22px;overflow:hidden;position:relative;height:200px;background:var(--g) center/cover;box-shadow:0 10px 30px rgba(123,92,255,.18)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(29,27,46,.85))}
.hero .ico{position:absolute;top:22px;right:22px;font-size:54px;opacity:.5}
.hero h1{position:absolute;bottom:26px;left:16px;right:16px;z-index:1;font-size:25px;color:#fff;line-height:1.2}.hero p{position:absolute;bottom:8px;left:16px;z-index:1;color:#e5e5f0;font-size:13px}
h2{font-size:18px;margin:22px 0 12px}.steps{display:flex;gap:6px;margin-top:10px}.steps span{flex:1;height:5px;border-radius:5px;background:#e4e2ee}.steps span.on{background:var(--g)}
.card{background:#fff;border:2px solid transparent;border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card:hover{border-color:#ddd6ff}.card.sel{border-color:var(--m);background:var(--soft)}
.card img,.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0}.card img.sq{border-radius:14px}
.av{display:flex;align-items:center;justify-content:center;background:var(--g);color:#fff;font-weight:700;font-size:20px}
.card .t{flex:1}.card b{display:block}.card small{color:#8a88a0}.price{color:var(--m);font-weight:700}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.day{min-width:62px;text-align:center;background:#fff;border-radius:16px;padding:10px 0;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.day.sel{background:var(--g);color:#fff}.day.off{opacity:.35;pointer-events:none;box-shadow:none}.day small{color:inherit;opacity:.7;display:block;font-size:11px}
.fmt{display:flex;justify-content:flex-end;gap:4px;margin-top:14px}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.hour{background:#fff;border-radius:14px;padding:12px 0;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.05);font-size:15px}
.hour.sel{background:var(--g);color:#fff}
.msg{grid-column:1/-1;color:#8a88a0;text-align:center;padding:10px 0}
input{width:100%;padding:15px;border-radius:16px;border:2px solid #e4e2ee;background:#fff;color:#1d1b2e;font-size:16px;margin-bottom:10px;font-family:inherit;outline:none}input:focus{border-color:var(--m)}
.btn{width:100%;padding:17px;border:none;border-radius:18px;background:var(--g);color:#fff;font-weight:700;font-size:17px;margin-top:16px;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(123,92,255,.3)}
.btn:disabled{opacity:.35;box-shadow:none}.back{background:none;color:#8a88a0;font-size:14px;margin-top:6px;box-shadow:none}
.err{color:#e5484d;font-size:14px;min-height:20px;margin-top:6px}
.sum{background:#fff;border-radius:18px;padding:16px;line-height:1.9;box-shadow:0 2px 10px rgba(0,0,0,.05)}.ok{text-align:center;padding-top:30px}.ok .c{font-size:64px}
.hide{display:none}.info{display:flex;gap:14px;flex-wrap:wrap;color:#8a88a0;font-size:13px;margin-top:14px}.info a{color:inherit}
.fallo{text-align:center;color:#8a88a0;padding:60px 10px}
</style></head><body><div class="app">
<div class="brand"><img src="logo.svg?v=3" alt="lunicitas"><div class="langs"><button id="l-es" onclick="setL('es')">ES</button><button id="l-en" onclick="setL('en')">EN</button><button id="l-pt" onclick="setL('pt')">PT</button></div></div>
<div id="fallo" class="fallo hide"></div>
<section id="s0" class="hide"><div class="hero" id="hero"><span class="ico" id="ico"></span><h1 id="nom"></h1><p id="abierto"></p></div>
<div class="info"><span id="addr"></span><a id="tel"></a></div>
<p style="color:#6b6980;margin-top:16px;font-size:14px" id="desc"></p>
<button class="btn" onclick="go(1)" data-i="book"></button></section>
<section id="s1" class="hide"><div class="steps"><span class="on"></span><span></span><span></span></div>
<h2 data-i="q1"></h2><div id="svc"></div><h2 id="q2"></h2><div id="brb"></div>
<button class="btn" id="b1" disabled onclick="go(2)" data-i="next"></button><button class="btn back" onclick="go(0)" data-i="back"></button></section>
<section id="s2" class="hide"><div class="steps"><span class="on"></span><span class="on"></span><span></span></div>
<h2 data-i="when"></h2><div class="days" id="days"></div>
<div class="fmt"><button id="f12" onclick="setF(12)">12 h</button><button id="f24" onclick="setF(24)">24 h</button></div>
<div class="hours" id="hours"></div>
<button class="btn" id="b2" disabled onclick="go(3)" data-i="next"></button><button class="btn back" onclick="go(1)" data-i="back"></button></section>
<section id="s3" class="hide"><div class="steps"><span class="on"></span><span class="on"></span><span class="on"></span></div>
<h2 data-i="confirm"></h2><div class="sum" id="sum"></div><h2 data-i="data"></h2>
<input id="nm" maxlength="80" data-ph="name" oninput="chk()"><input id="ph" type="tel" maxlength="20" data-ph="phone" oninput="chk()">
<p class="err" id="err"></p>
<button class="btn" id="b3" disabled onclick="reservar()" data-i="doBook"></button><button class="btn back" onclick="go(2)" data-i="back"></button></section>
<section id="s4" class="hide ok"><div class="c">🎉</div><h2><span data-i="done"></span> <span id="who"></span>!</h2>
<p style="color:#6b6980" data-i="doneTxt"></p><div class="sum" id="sum2" style="margin-top:18px;text-align:left"></div>
<button class="btn" onclick="location.reload()" data-i="home"></button></section>
</div>
<script>
const T={
es:{title:'Reserva tu cita',open:'Abierto hoy',closed:'Cerrado hoy',call:'Llamar',book:'Reservar cita',q1:'¿Qué te hacemos hoy?',next:'Continuar',back:'← Atrás',when:'¿Cuándo vienes?',pickDay:'Elige un día para ver los horarios',loading:'Cargando horarios…',none:'No quedan horas libres este día. Prueba otro.',confirm:'Confirma tu cita',data:'Tus datos',name:'Tu nombre',phone:'Tu teléfono (WhatsApp)',doBook:'Confirmar reserva',booking:'Reservando…',done:'¡Listo,',doneTxt:'Tu cita quedó reservada. Te esperamos.',home:'Volver al inicio',with:'Con',at:'a las',total:'Total',today:'Hoy',days:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],any:'Cualquiera',anyD:'El primero disponible',am:' a. m.',pm:' p. m.',e400:'Revisa los datos de tu reserva',e409:'Esa hora acaba de ocuparse, elige otra',e429:'Demasiadas reservas, intenta más tarde',eNet:'Sin conexión, intenta de nuevo',eGen:'No se pudo reservar',e404:'No encontramos este negocio. Revisa el enlace.',eSetup:'Esta app aún no está instalada.',staff:{barberia:'Elige tu barbero',salon:'Elige tu estilista',estetica:'Elige tu especialista'}},
en:{title:'Book your appointment',open:'Open today',closed:'Closed today',call:'Call',book:'Book appointment',q1:'What can we do for you today?',next:'Continue',back:'← Back',when:'When are you coming?',pickDay:'Pick a day to see available times',loading:'Loading times…',none:'No times left on this day. Try another one.',confirm:'Confirm your appointment',data:'Your details',name:'Your name',phone:'Your phone (WhatsApp)',doBook:'Confirm booking',booking:'Booking…',done:'All set,',doneTxt:'Your appointment is booked. See you soon.',home:'Back to start',with:'With',at:'at',total:'Total',today:'Today',days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],any:'Anyone',anyD:'First available',am:' AM',pm:' PM',e400:'Please check your booking details',e409:'That time was just taken, please pick another',e429:'Too many bookings, try again later',eNet:'No connection, please try again',eGen:'Could not complete the booking',e404:'We could not find this business. Check the link.',eSetup:'This app is not installed yet.',staff:{barberia:'Choose your barber',salon:'Choose your stylist',estetica:'Choose your specialist'}},
pt:{title:'Agende seu horário',open:'Aberto hoje',closed:'Fechado hoje',call:'Ligar',book:'Agendar horário',q1:'O que vamos fazer hoje?',next:'Continuar',back:'← Voltar',when:'Quando você vem?',pickDay:'Escolha um dia para ver os horários',loading:'Carregando horários…',none:'Não há horários livres neste dia. Tente outro.',confirm:'Confirme seu horário',data:'Seus dados',name:'Seu nome',phone:'Seu telefone (WhatsApp)',doBook:'Confirmar agendamento',booking:'Agendando…',done:'Pronto,',doneTxt:'Seu horário está agendado. Te esperamos.',home:'Voltar ao início',with:'Com',at:'às',total:'Total',today:'Hoje',days:['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],any:'Qualquer um',anyD:'O primeiro disponível',am:' AM',pm:' PM',e400:'Confira os dados do agendamento',e409:'Esse horário acabou de ser ocupado, escolha outro',e429:'Muitos agendamentos, tente mais tarde',eNet:'Sem conexão, tente novamente',eGen:'Não foi possível agendar',e404:'Não encontramos este negócio. Confira o link.',eSetup:'Este app ainda não está instalado.',staff:{barberia:'Escolha seu barbeiro',salon:'Escolha seu cabeleireiro',estetica:'Escolha seu especialista'}}};
const ICO={barberia:'✂️',salon:'💇',estetica:'✨'};
const HERO={barberia:'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=900'};
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// El negocio sale de ?n=slug o de la dirección lunicitas.com/slug
const N=(new URLSearchParams(location.search).get('n')||location.pathname.split('/').pop().replace(/\.html$/,'').replace(/^index$/,'')).toLowerCase().replace(/[^a-z0-9-]/g,'');
let D=null,st={},horas=[],F=localStorage.getItem('fmt')==='24'?24:12,err=null;
let L=localStorage.getItem('lang')||(navigator.language||'es').slice(0,2);if(!T[L])L='es';
const t=k=>T[L][k];
const money=v=>D.negocio.moneda+(Number.isInteger(v)?v:v.toFixed(2));
function staff(){let e=D.equipo.map(m=>({...m}));if(e.length>1)e.unshift({id:0,nombre:t('any'),especialidad:t('anyD')});return e}
function mName(id){return id===0?t('any'):(D.equipo.find(m=>m.id===id)||{}).nombre}
function fmt(x){if(F==24)return x;let[h,m]=x.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?t('am'):t('pm'))}
function pd(s){let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function hrs(f){let h=D.negocio.horario[pd(f).getDay()];return h&&h[0]&&h[1]&&!D.cerrado.includes(f)?h:null}
function setL(l){L=l;localStorage.setItem('lang',l);document.documentElement.lang=l;
['es','en','pt'].forEach(x=>$('l-'+x).classList.toggle('on',x==l));
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
if(err){$('fallo').textContent=t(err);return}if(!D)return;
document.title=D.negocio.nombre+' – '+t('title');$('q2').textContent=t('staff')[D.negocio.tipo]||t('staff').barberia;$('tel').textContent=D.negocio.telefono?'📞 '+t('call'):'';
drawCards();setF(F);if(!$('s2').classList.contains('hide'))drawDays();fill()}
function setF(n){F=n;localStorage.setItem('fmt',n);$('f12').classList.toggle('on',n==12);$('f24').classList.toggle('on',n==24);
if(D){let h=hrs(D.hoy);$('abierto').textContent=h?t('open')+' '+fmt(h[0].replace(/^0/,''))+' – '+fmt(h[1].replace(/^0/,'')):t('closed');if(st.f)drawHours();fill()}}
function pic(o,sq){return o.foto?`<img class="${sq?'sq':''}" src="${esc(o.foto)}" alt="">`:(sq?'':`<span class="av">${o.id===0?'★':esc(o.nombre.charAt(0))}</span>`)}
function drawCards(){
$('svc').innerHTML=D.servicios.map(s=>`<div class="card ${st.svc===s.id?'sel':''}" onclick="pick('svc',${s.id},this)">${pic(s,1)}<div class="t"><b>${esc(s.nombre)}</b><small>${s.duracion} min</small></div><span class="price">${esc(money(s.precio))}</span></div>`).join('');
$('brb').innerHTML=staff().map(m=>`<div class="card ${st.brb===m.id?'sel':''}" onclick="pick('brb',${m.id},this)">${pic(m)}<div class="t"><b>${esc(m.nombre)}</b><small>${esc(m.especialidad)}</small></div></div>`).join('')}
function go(n){for(let i=0;i<5;i++)$('s'+i).classList.toggle('hide',i!==n);window.scrollTo(0,0);if(n==2)initDays();if(n>=3)fill()}
function initDays(){delete st.day;delete st.hr;delete st.f;horas=[];drawDays();$('hours').innerHTML=`<p class="msg">${t('pickDay')}</p>`;upd()}
function drawDays(){let d=pd(D.hoy),dh='';
for(let i=0;i<14;i++){let x=new Date(d);x.setDate(d.getDate()+i);let f=iso(x),off=!hrs(f);
dh+=`<div class="day ${off?'off':''} ${st.f===f?'sel':''}" onclick="pick('day','${f}',this)"><small>${i==0?t('today'):t('days')[x.getDay()]}</small><b>${x.getDate()}</b></div>`}
$('days').innerHTML=dh}
function dl(){let x=pd(st.f);return (st.f===D.hoy?t('today'):t('days')[x.getDay()])+' '+x.getDate()}
async function loadHours(){$('hours').innerHTML=`<p class="msg">${t('loading')}</p>`;horas=[];let f=st.f;
try{let r=await fetch('api.php?'+new URLSearchParams({n:D.negocio.slug,fecha:f,servicio:st.svc,equipo:st.brb}));let j=await r.json();if(f!==st.f)return;horas=j.horas||[]}catch(e){}
drawHours()}
function drawHours(){$('hours').innerHTML=horas.length?horas.map(x=>`<div class="hour ${st.hr===x?'sel':''}" onclick="pick('hr','${x}',this)">${fmt(x)}</div>`).join(''):`<p class="msg">${t('none')}</p>`}
function pick(k,v,el){el.parentNode.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');st[k]=v;
if(k=='day'){st.f=v;delete st.hr;loadHours()}upd()}
function upd(){$('b1').disabled=!(st.svc!=null&&st.brb!=null);$('b2').disabled=!(st.f&&st.hr)}
function chk(){$('b3').disabled=!($('nm').value.trim().length>1&&$('ph').value.replace(/[^0-9]/g,'').length>6)}
function fill(){if(!D||st.svc==null||st.hr==null)return;let s=D.servicios.find(x=>x.id===st.svc);
let x=`${ICO[D.negocio.tipo]||'✂️'} <b>${esc(s.nombre)}</b> · ${s.duracion} min<br>👤 ${t('with')} <b>${esc(st.con||mName(st.brb))}</b><br>📅 <b>${dl()}</b> ${t('at')} <b>${fmt(st.hr)}</b><br>💵 ${t('total')}: <b class="price">${esc(money(s.precio))}</b>`;
$('sum').innerHTML=x;$('sum2').innerHTML=x;$('who').textContent=$('nm').value.trim().split(' ')[0]}
async function reservar(){let b=$('b3');b.disabled=true;b.textContent=t('booking');$('err').textContent='';
try{let r=await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:D.negocio.slug,servicio:st.svc,equipo:st.brb,fecha:st.f,hora:st.hr,nombre:$('nm').value,telefono:$('ph').value,idioma:L})});
if(r.ok){let j=await r.json();st.con=j.con;fill();go(4)}else{$('err').textContent=t({400:'e400',409:'e409',429:'e429'}[r.status]||'eGen')}}
catch(e){$('err').textContent=t('eNet')}
b.textContent=t('doBook');chk()}
async function init(){
try{let r=await fetch('api.php?n='+encodeURIComponent(N));if(r.status===503){location.href='install.php';return}if(!r.ok){err='e404'}else D=await r.json()}catch(e){err='eNet'}
if(err){$('fallo').classList.remove('hide');setL(L);return}
let n=D.negocio;$('nom').textContent=n.nombre;$('ico').textContent=(n.foto||HERO[n.tipo])?'':(ICO[n.tipo]||'');$('addr').textContent=n.direccion?'📍 '+n.direccion:'';$('desc').textContent=n.descripcion;
let img=n.foto||HERO[n.tipo];if(img)$('hero').style.backgroundImage=`url("${encodeURI(img)}")`;
if(n.telefono)$('tel').href='tel:'+n.telefono.replace(/[^0-9+]/g,'');
$('s0').classList.remove('hide');setL(L)}
init();
</script></body></html>
