function drawDays(){let d=pd(D.hoy),dh='';
for(let i=0;i<14;i++){let x=new Date(d);x.setDate(d.getDate()+i);let f=iso(x),off=!hrs(f);
dh+=`<div class="day ${off?'off':''} ${st.f===f?'sel':''}" onclick="pick('day','${f}',this)"><small>${i==0?t('today'):t('days')[x.getDay()]}</small><b>${x.getDate()}</b></div>`}
$('days').innerHTML=dh}
function dl(){let x=pd(st.f);return (st.f===D.hoy?t('today'):t('days')[x.getDay()])+' '+x.getDate()}
async function loadHours(){$('hours').innerHTML=`<p class="msg">${t('loading')}</p>`;horas=[];let f=st.f;
try{let r=await fetch('api.php?'+new URLSearchParams({n:D.negocio.slug,fecha:f,servicio:st.svc,equipo:st.brb}));let j=await r.json();if(f!==st.f)return;horas=j.horas||[]}catch(e){}
drawHours()}
function drawHours(){$('hours').innerHTML=horas.length?horas.map(x=>`<div class="hour ${st.hr===x?'sel':''}" onclick="pick('hr','${x}',this)">${fmt(x)}</div>`).join(''):`<p class="msg">${t('none')}</p>`}
function pick(k,v,el){el.parentNode.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');st[k]=v;
if(k=='day'){st.f=v;delete st.hr;loadHours()}upd()}
function upd(){$('b1').disabled=!(st.svc!=null&&st.brb!=null);$('b2').disabled=!(st.f&&st.hr)}
function chk(){$('b3').disabled=!($('nm').value.trim().length>1&&$('ph').value.replace(/[^0-9]/g,'').length>6)}
function fill(){if(!D||st.svc==null||st.hr==null)return;let s=D.servicios.find(x=>x.id===st.svc);
let x=`${ICO[D.negocio.tipo]||'✂️'} <b>${esc(s.nombre)}</b> · ${s.duracion} min<br>👤 ${t('with')} <b>${esc(st.con||mName(st.brb))}</b><br>📅 <b>${dl()}</b> ${t('at')} <b>${fmt(st.hr)}</b><br>💵 ${t('total')}: <b class="price">${esc(money(s.precio))}</b>`;
$('sum').innerHTML=x;$('sum2').innerHTML=x;$('who').textContent=$('nm').value.trim().split(' ')[0]}
// Enlaces para guardar la cita: archivo .ics (iPhone, Android, Outlook), Google Calendar y Outlook en la web
function calendario(c){if(!c)return;const iso=x=>x.replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/,'$1-$2-$3T$4:$5:$6Z');
$('calIcs').href=c.ics;
$('calG').href='https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:c.t,dates:c.i+'/'+c.f,details:c.n,location:c.l});
$('calO').href='https://outlook.live.com/calendar/0/action/compose?'+new URLSearchParams({path:'/calendar/action/compose',rru:'addevent',subject:c.t,startdt:iso(c.i),enddt:iso(c.f),body:c.n,location:c.l});
$('cal').classList.remove('hide')}
// Enlace para recomendar (solo si se unió al club)
function recomendar(c){if(!c)return;$('refLink').textContent=c.enlace;
$('refTxt').textContent=c.meta>0&&c.pct>0?t('refRule').replace('{n}',c.meta).replace('{p}',c.pct):t('refShare');
$('refWa').href='https://wa.me/?text='+encodeURIComponent(t('refMsg').replace('{neg}',D.negocio.nombre)+' '+c.enlace);
$('refCopy').onclick=e=>{e.preventDefault();(navigator.clipboard?navigator.clipboard.writeText(c.enlace):Promise.reject()).then(()=>{$('refCopy').textContent=t('copied')},()=>{})};
$('refBox').classList.remove('hide')}
function clubTexto(){if(!D||!D.club)return;let c=D.club;$('clubTxt').textContent=c.meta>0&&c.pct>0?t('clubWhy').replace('{n}',c.meta).replace('{p}',c.pct):t('clubWhy0')}
async function reservar(){let b=$('b3');b.disabled=true;b.textContent=t('booking');$('err').textContent='';
try{let r=await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:D.negocio.slug,servicio:st.svc,equipo:st.brb,fecha:st.f,hora:st.hr,nombre:$('nm').value,telefono:$('ph').value,idioma:L,club:$('clubSi').checked,email:$('clubMail').value,ref:REF})});
if(r.ok){let j=await r.json();st.con=j.con;fill();calendario(j.cal);recomendar(j.club);go(4)}else{$('err').textContent=t({400:'e400',409:'e409',429:'e429'}[r.status]||'eGen')}}
catch(e){$('err').textContent=t('eNet')}
b.textContent=t('doBook');chk()}
async function init(){
try{let r=await fetch('api.php?n='+encodeURIComponent(N)+(REF?'&ref='+encodeURIComponent(REF):''));if(r.status===503){location.href='install.php';return}if(!r.ok){err='e404'}else D=await r.json()}catch(e){err='eNet'}
if(err){$('fallo').classList.remove('hide');setL(L);return}
let n=D.negocio;$('nom').textContent=n.nombre;$('ico').textContent=(n.foto||HERO[n.tipo])?'':(ICO[n.tipo]||'');$('addr').textContent=n.direccion?'📍 '+n.direccion:'';$('desc').textContent=n.descripcion;
let img=n.foto||HERO[n.tipo];if(img)$('hero').style.backgroundImage=`url("${encodeURI(img)}")`;
if(n.telefono)$('tel').href='tel:'+n.telefono.replace(/[^0-9+]/g,'');
if(D.registro)$('pie').classList.remove('hide');
if(D.suspendido){$('b0').classList.add('hide');$('pausa').classList.remove('hide')}
if(D.club){$('clubBox').classList.remove('hide');clubTexto();if(D.club.ref&&D.club.bienvenida>0){$('bienv').classList.remove('hide')}}
$('s0').classList.remove('hide');setL(L)}
init();
</script></body></html>
